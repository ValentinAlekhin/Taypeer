[workspace]
members = ["crates/taypeer-core", "crates/taypeer-document", "crates/taypeer-services", "crates/taypeer-storage", "crates/taypeer-runtime", "crates/taypeer-trust", "crates/taypeer-sync", "apps/taypeer", "apps/taypeer/crates/taypeer-database-ui", "apps/taypeer/crates/taypeer-sync-ui", "apps/taypeer/crates/taypeer-settings-ui", "apps/taypeer/crates/taypeer-runtime-client", "apps/taypeer/crates/taypeer-desktop-platform", "apps/taypeer/crates/taypeer-ui", "apps/taypeer-cli"]
default-members = ["apps/taypeer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
taypeer-database-ui = { path = "apps/taypeer/crates/taypeer-database-ui" }
taypeer-sync-ui = { path = "apps/taypeer/crates/taypeer-sync-ui" }
taypeer-settings-ui = { path = "apps/taypeer/crates/taypeer-settings-ui" }
taypeer-runtime-client = { path = "apps/taypeer/crates/taypeer-runtime-client" }
taypeer-desktop-platform = { path = "apps/taypeer/crates/taypeer-desktop-platform" }
taypeer-ui = { path = "apps/taypeer/crates/taypeer-ui" }

qrcode = { version = "=0.14.1", default-features = false }
taypeer-trust = { path = "crates/taypeer-trust" }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
security-framework = "=3.7.0"
taypeer-sync = { path = "crates/taypeer-sync" }
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
url = "=2.5.8"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
html5ever = "=0.27.0"
usvg = { version = "=0.46.0", default-features = false }
roxmltree = "=0.20.0"
fractional_index = { version = "=2.0.2", default-features = false }
sha2 = "=0.10.9"
clap = { version = "=4.6.6", features = ["derive", "string"] }
clap-repl = "=0.3.2"
crossterm = "=0.28.1"
taypeer-runtime = { path = "crates/taypeer-runtime" }
taypeer-storage = { path = "crates/taypeer-storage" }
argon2 = "=0.5.3"
chacha20poly1305 = "=0.10.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = { version = "=1.9.0", features = ["serde"] }
tempfile = "=3.27.0"

taypeer-core = { path = "crates/taypeer-core" }
taypeer-document = { path = "crates/taypeer-document" }
taypeer-services = { path = "crates/taypeer-services" }
automerge = "=0.7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "3"
toml = "0.9"
chrono = "0.4"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "21f6ce6097c686e98e0ca62ff6178bb4612541a1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
