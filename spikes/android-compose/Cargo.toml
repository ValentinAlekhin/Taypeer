[workspace]
resolver = "2"

[workspace.dependencies]
uniffi = "=0.29.4"
thiserror = "=2.0.18"
zeroize = "=1.8.2"
toml = "=0.5.11"

[package]
name = "taypeer-ui-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
uniffi.workspace = true
thiserror.workspace = true
zeroize.workspace = true
toml.workspace = true

[profile.dev]
debug = 0
