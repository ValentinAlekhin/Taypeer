[workspace]
resolver = "3"

[workspace.dependencies]
argon2 = "=0.5.3"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = "=2.2.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
zeroize = "=1.9.0"
automerge = "=0.7.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tempfile = "=3.27.0"
iroh = { version = "=1.1.0", default-features = false, features = ["test-utils", "tls-ring"] }
iroh-relay = { version = "=1.1.0", default-features = false, features = ["test-utils", "tls-ring"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "time", "io-util"] }
libc = "=0.2.183"
jni = "=0.21.1"

[package]
name = "taypeer-encrypted-sync-spike"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "taypeer-encrypted-sync-spike"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
android-jni = ["network", "dep:jni"]
network = ["dep:iroh", "dep:tokio", "dep:iroh-relay"]

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
sha2.workspace = true
zeroize.workspace = true
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
iroh = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
iroh-relay = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "sync-node"
path = "src/bin/sync-node.rs"
required-features = ["network"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true, optional = true }
