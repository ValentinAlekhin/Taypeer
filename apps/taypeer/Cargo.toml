[package]
name = "taypeer"
default-run = "taypeer"
description = "Taypeer desktop shell (macOS and Linux adapters)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
component-rendering = ["taypeer-ui/component-rendering", "taypeer-database-ui/component-rendering", "taypeer-settings-ui/component-rendering", "taypeer-sync-ui/component-rendering", "gpui-kit/test-support"]
ui-test-support = ["taypeer-database-ui/ui-test-support", "taypeer-sync-ui/ui-test-support", "taypeer-settings-ui/ui-test-support", "taypeer-runtime-client/ui-test-support", "taypeer-desktop-platform/ui-test-support", "taypeer-ui/ui-test-support", "gpui-kit/test-support", "taypeer-runtime/ui-test-support"]

[[bin]]
name = "taypeer-ui-worker"
path = "src/bin/ui-worker.rs"
required-features = ["ui-test-support"]

[[test]]
name = "components"
path = "tests/components/main.rs"
harness = false
required-features = ["component-rendering"]

[[test]]
name = "ui"
harness = false
required-features = ["ui-test-support"]

[dependencies]
taypeer-database-ui.workspace = true
taypeer-sync-ui.workspace = true
taypeer-settings-ui.workspace = true
taypeer-runtime-client.workspace = true
taypeer-desktop-platform.workspace = true
taypeer-ui.workspace = true

taypeer-services.workspace = true
taypeer-runtime.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gpui-kit.workspace = true
rust-i18n.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
serde.workspace = true
image.workspace = true
