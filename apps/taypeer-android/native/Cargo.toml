[package]
name = "taypeer-android"
description = "Application-owned typed Android boundary for Taypeer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "taypeer-android-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
uniffi.workspace = true
toml.workspace = true
serde.workspace = true
taypeer-services.workspace = true
taypeer-runtime.workspace = true
taypeer-storage.workspace = true
zeroize.workspace = true

[lints]
workspace = true
