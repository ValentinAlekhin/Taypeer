[package]
name = "taypeer-android"
description = "Application-owned typed Android boundary for Taypeer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bindgen = ["uniffi/cli"]
android-test-support = []

[[bin]]
name = "taypeer-android-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
uniffi.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
taypeer-core.workspace = true
taypeer-document.workspace = true
taypeer-trust.workspace = true
taypeer-sync.workspace = true
taypeer-services.workspace = true
taypeer-runtime.workspace = true
taypeer-storage.workspace = true
zeroize.workspace = true
image.workspace = true
resvg.workspace = true
filedescriptor.workspace = true
rustix.workspace = true
base64.workspace = true
rand_core.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["pipe"] }
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
tokio.workspace = true

[lints]
workspace = true
