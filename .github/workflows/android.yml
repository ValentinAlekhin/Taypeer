name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: ARM64 APK and native packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select installed JDK 17
        run: |
          test -d "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Install repository Rust toolchain and Android target
        run: |
          rustup show
          rustup target add aarch64-linux-android
      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Rust bridge tests and lints
        run: |
          cargo test --locked -p taypeer-android --lib
          cargo clippy --locked -p taypeer-android --all-targets --all-features -- -D warnings
      - name: Bindings, Kotlin, lint, APK and ARM64 16-KiB packaging
        run: sh apps/taypeer-android/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: taypeer-android-debug
          path: |
            apps/taypeer-android/app/build/outputs/apk/
            apps/taypeer-android/app/build/reports/
          if-no-files-found: warn
          retention-days: 7
