name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: Project checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS run the shared desktop scenarios.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install architecture tooling
        run: pnpm install --frozen-lockfile
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libx11-dev libegl1-mesa-dev libvulkan-dev libglib2.0-dev libssl-dev
      - name: Install repository toolchain
        run: rustup show
      - name: Check architecture, documentation and Rust
        run: sh scripts/check.sh
      - name: Upload UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taypeer-ui-diagnostics
          path: artifacts/ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build architecture viewer
        if: runner.os == 'Linux'
        run: pnpm arch:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: taypeer-architecture
          path: artifacts/architecture/
          if-no-files-found: error
          retention-days: 14

  linux-package:
    name: Linux Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Nix
        run: sudo apt-get update && sudo apt-get install -y nix-bin && sudo systemctl start nix-daemon
      - name: Build production package
        run: nix --extra-experimental-features 'nix-command flakes' build .#taypeer --cores 2
      - name: Check packaged private worker and fixture exclusion
        run: sh scripts/check-linux-package.sh result
      - name: Verify encrypted sessions with packaged worker
        run: nix --extra-experimental-features 'nix-command flakes' develop -c env TAYPEER_PUBLIC_LINUX_WORKER="$PWD/result/bin/taypeer" cargo test -p taypeer-runtime host::linux_tests --locked -- --test-threads=1
