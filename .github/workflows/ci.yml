name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Project checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu checks portability of the core; it is not a release target.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install architecture tooling
        run: pnpm install --frozen-lockfile
      - name: Install repository toolchain
        run: rustup show
      - name: Check architecture, documentation and Rust
        run: sh scripts/check.sh
      - name: Build architecture viewer
        if: runner.os == 'Linux'
        run: pnpm arch:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: taypeer-architecture
          path: artifacts/architecture/
          if-no-files-found: error
          retention-days: 14
